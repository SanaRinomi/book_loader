[project]
name = "book-loader"
version = "0.1.0"
description = "DRM removal tool for Adobe ACSM (EPUB/PDF) and Kobo Desktop (KEPUB) ebooks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "spreered", email = "spreered@gmail.com"},
]
keywords = ["ebook", "drm", "acsm", "adobe", "kobo", "kepub", "epub", "pdf", "drm-removal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Environment :: Console",
]
dependencies = [
    # Adobe ACSM core dependencies
    "lxml>=4.9.0",
    "asn1crypto>=1.5.0",
    "pycryptodome>=3.18.0",
    "rsa>=4.9",
    # CLI interface
    "click>=8.1.0",
    "questionary>=2.0",
    # EPUB processing and conversion
    "ebooklib>=0.18",
    "Pillow>=10.0.0",
    "weasyprint>=60.0", # EPUB → PDF conversion
]

[project.urls]
Homepage = "https://github.com/spreered/book_loader"
Repository = "https://github.com/spreered/book_loader"
Issues = "https://github.com/spreered/book_loader/issues"

[project.scripts]
book-loader = "book_loader.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]
# Vendored code stays byte-identical to upstream, so it is never reformatted
# (REFACTOR_PLAN §2).
force-exclude = '/_vendor/'

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored code is not linted or fixed (REFACTOR_PLAN §2).
force-exclude = true
extend-exclude = ["**/_vendor/**"]

[tool.pyright]
# T2.14: the new packages and the tests are type-checked. The old core/, utils/ and
# cli.py are left out until Phase 6 deletes them, with the characterization tests that
# exercise them; vendored code is never checked (REFACTOR_PLAN §2). Add each new
# package under src/book_loader as it appears; it is checked unless excluded here.
include = ["src/book_loader", "tests"]
exclude = [
    "src/book_loader/core",
    "src/book_loader/utils",
    "src/book_loader/cli.py",
    "**/_vendor",
    "tests/characterization",
    "**/__pycache__",
]
typeCheckingMode = "standard"
# Libraries without type information (asn1crypto) count as untyped instead of having
# their types guessed from their source, which gives wrong types such as "Void".
useLibraryCodeForTypes = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not network and not live"'
markers = [
    "network: talks to real Adobe servers",
    "live: needs a real install or a private file, such as Kobo Desktop or a real ADEPT PDF",
    "weasyprint: needs WeasyPrint's native libraries",
    "windows_only: runs only on Windows",
    "macos_only: runs only on macOS",
    "posix_only: runs only on macOS and Linux",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "cryptography>=50.0.1",
    "lxml-stubs>=0.5.1",
    "oscrypto>=1.3.0",
    "pyright>=1.1.414",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.1",
    "time-machine>=3.5.1",
]
