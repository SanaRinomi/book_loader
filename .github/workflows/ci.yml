# T0.5.1, switched on in T0.6.1. Runs the local check (tests/tools/check.py) on the
# fork's hosted runners for every push to main and every PR (REFACTOR_PLAN §2.1).
#
# setup-uv publishes no major tags since v8, so it is pinned by commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The same script as the local check: sync, ruff, black --check, pyright and pytest
      # with coverage, for this job's Python version. The script itself needs Python
      # 3.11+ (tomllib), hence the fixed launcher version. -rs lists why each test skipped,
      # since which tests skip differs per OS.
      - run: uv run --no-project --python 3.14 python tests/tools/check.py --python ${{ matrix.python }} -- -rs
