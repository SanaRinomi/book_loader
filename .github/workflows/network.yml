# T0.5.2. Tests marked `network`, which talk to real Adobe servers. Manual only
# (workflow_dispatch). Once the first network test exists, add the secrets below in the
# fork's settings and run it once (T0.6.5, item D1).
#
# Secrets use the BL_TEST_ prefix, not BOOK_LOADER_: the test suite clears every
# BOOK_LOADER_* variable so a developer's settings can't leak into tests.
name: Network tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    # The OS the manual checks (T6.5) use; one account, so one job.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --python 3.14
      # Exits with code 5 ("no tests collected") until the first network test exists.
      - run: uv run --no-sync pytest -m network -v
        env:
          BL_TEST_ADOBE_ID_EMAIL: ${{ secrets.BL_TEST_ADOBE_ID_EMAIL }}
          BL_TEST_ADOBE_ID_PASSWORD: ${{ secrets.BL_TEST_ADOBE_ID_PASSWORD }}
